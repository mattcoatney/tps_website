<!-- Third Peak — Stacked, coral peaks + white text — use on slate/dark backgrounds -->
<!-- Mark and wordmark are roughly equal width (~160px) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 148" fill="none">
  <rect width="160" height="148" fill="#2D4057" rx="0"/>
  <!-- Mountain mark scaled 2x to fill 160px width (original viewBox 0 0 80 50) -->
  <svg x="0" y="0" width="160" height="100" viewBox="0 0 80 50">
    <path d="M0 48 L18 28 L36 48Z"  fill="#E86048" opacity="0.30"/>
    <path d="M14 48 L36 12 L58 48Z" fill="#E86048" opacity="0.62"/>
    <path d="M32 48 L56 2 L80 48Z"  fill="#E86048"/>
  </svg>
  <!-- Wordmark — centered, sized to roughly match 160px mark width -->
  <text x="80" y="138"
        font-family="'Source Serif 4', Georgia, serif"
        font-size="28" font-weight="400" letter-spacing="0.5"
        text-anchor="middle"
        fill="#FFFFFF">Third Peak</text>
</svg>
