<!-- Third Peak — Horizontal, monochrome slate — use on white or light backgrounds -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 262 50" fill="none">
  <rect width="262" height="50" fill="#FFFFFF" rx="0"/>
  <!-- Mountain mark — all slate, opacity for depth -->
  <path d="M0 48 L18 28 L36 48Z"  fill="#2D4057" opacity="0.30"/>
  <path d="M14 48 L36 12 L58 48Z" fill="#2D4057" opacity="0.62"/>
  <path d="M32 48 L56 2 L80 48Z"  fill="#2D4057"/>
  <!-- Wordmark -->
  <text x="92" y="37"
        font-family="'Source Serif 4', Georgia, serif"
        font-size="28" font-weight="400" letter-spacing="-0.5"
        fill="#2D4057">Third Peak</text>
</svg>
