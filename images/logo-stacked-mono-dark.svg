<!-- Third Peak — Stacked, monochrome slate peaks + text — use on white/light backgrounds -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 148" fill="none">
  <!-- Mountain mark scaled 2x — all slate, opacity for depth -->
  <svg x="0" y="0" width="160" height="100" viewBox="0 0 80 50">
    <path d="M0 48 L18 28 L36 48Z"  fill="#2D4057" opacity="0.30"/>
    <path d="M14 48 L36 12 L58 48Z" fill="#2D4057" opacity="0.62"/>
    <path d="M32 48 L56 2 L80 48Z"  fill="#2D4057"/>
  </svg>
  <!-- Wordmark -->
  <text x="80" y="138"
        font-family="'Source Serif 4', Georgia, serif"
        font-size="28" font-weight="400" letter-spacing="0.5"
        text-anchor="middle"
        fill="#2D4057">Third Peak</text>
</svg>
